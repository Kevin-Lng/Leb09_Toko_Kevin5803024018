
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      RABBITMQ_USER: appuser
      RABBITMQ_PASSWORD: lab13-ci-only-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build dan jalankan Docker Compose
        run: docker compose up -d --build --wait

      - name: Periksa status container
        run: docker compose ps

      - name: Jalankan automated tests
        env:
          BASE_URL: http://localhost:8082
        run: npm test

      - name: Tampilkan log service
        if: always()
        run: docker compose logs --no-color || true

      - name: Matikan Docker Compose
        if: always()
        run: docker compose down -v
